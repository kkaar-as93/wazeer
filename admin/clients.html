<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العملاء — وِشْ</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="app">

    <!-- الشريط الجانبي -->
    <aside class="sidebar">
      <div class="sidebar-logo">وِشْ — إدارة</div>

      <nav>
        <a href="index.html">الرئيسية</a>
        <a href="clients.html" class="active">العملاء</a>
        <a href="#">الموظفين</a>
        <a href="#">المشاريع</a>
        <a href="#">المهام</a>
      </nav>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main">

      <div class="topbar">
        <h1>العملاء</h1>
        <span id="connectionStatus" class="status-badge">
          جارٍ فحص الاتصال...
        </span>
      </div>

      <div class="card">

        <div class="clients-header">
          <div>
            <h2>قائمة العملاء</h2>
            <p>العملاء المسجلون في قاعدة البيانات</p>
          </div>
        </div>

        <div id="clientsContainer">
          <div class="loading">
            جارٍ تحميل العملاء...
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- شريط التنقل للجوال -->
  <nav class="mobile-nav">
    <a href="index.html">الرئيسية</a>
    <a href="clients.html" class="active">العملاء</a>
    <a href="#">الموظفين</a>
    <a href="#">المشاريع</a>
    <a href="#">المهام</a>
  </nav>

  <!-- مكتبة Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- إعداد الاتصال الموجود عندك -->
  <script src="js/supabase-client.js"></script>

  <script>

    async function loadClients() {

      const container = document.getElementById("clientsContainer");

      const { data, error } = await supabaseClient
        .from("clients")
        .select("id, name, email, phone")
        .order("name", { ascending: true });

      if (error) {

        console.error("خطأ في تحميل العملاء:", error);

        container.innerHTML = `
          <div class="error-message">
            تعذر تحميل العملاء ⚠️
            <br>
            <small>${error.message}</small>
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {

        container.innerHTML = `
          <div class="empty-message">
            لا يوجد عملاء حاليًا
          </div>
        `;

        return;
      }

      container.innerHTML = `
        <div class="clients-table-wrapper">
          <table class="clients-table">

            <thead>
              <tr>
                <th>الاسم</th>
                <th>البريد الإلكتروني</th>
                <th>الجوال</th>
              </tr>
            </thead>

            <tbody>
              ${data.map(client => `
                <tr>
                  <td>${client.name || "—"}</td>
                  <td>${client.email || "—"}</td>
                  <td>${client.phone || "—"}</td>
                </tr>
              `).join("")}
            </tbody>

          </table>
        </div>
      `;

    }


    // فحص الاتصال
    (async () => {

      const badge = document.getElementById("connectionStatus");

      const ok = await testSupabaseConnection();

      if (ok) {

        badge.textContent = "متصل بقاعدة البيانات ✅";
        badge.classList.add("connected");

      } else {

        badge.textContent = "تعذر الاتصال ⚠️";
        badge.classList.add("error");

      }

      // تحميل العملاء
      await loadClients();

    })();

  </script>

</body>
</html>
