<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>المهام المؤرشفة — وِشْ</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <div class="app">

    <!-- الشريط الجانبي -->
    <aside class="sidebar">

      <div class="sidebar-logo">
        وِشْ — إدارة
      </div>

      <nav>

        <a href="index.html">
          الرئيسية
        </a>

        <a href="clients.html">
          العملاء
        </a>

        <a href="employees.html">
          الموظفين
        </a>

        <a href="#">
          المشاريع
        </a>

        <a href="tasks.html">
          المهام
        </a>

        <a
          href="archived-tasks.html"
          class="active"
        >
          المؤرشفة
        </a>

      </nav>

      <button
        id="logoutButton"
        type="button"
      >
        تسجيل الخروج
      </button>

    </aside>


    <!-- المحتوى -->
    <main class="main">

      <div class="topbar">

        <h1>
          المهام المؤرشفة
        </h1>

        <span
          id="connectionStatus"
          class="status-badge"
        >
          جارٍ فحص الاتصال...
        </span>

      </div>


      <div class="card">

        <h2>
          المهام المؤرشفة
        </h2>

        <div id="tasksContainer">
          جارٍ تحميل المهام...
        </div>

      </div>

    </main>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase-client.js"></script>


  <script>

    // التحقق من المدير
    async function checkManagerAccess() {

      const {
        data: { user },
        error: sessionError
      } = await supabaseClient.auth.getUser();


      if (sessionError || !user) {

        window.location.href =
          "login.html";

        return;
      }


      const {
        data: employee,
        error
      } = await supabaseClient
        .from("employees")
        .select("role")
        .eq("id", user.id)
        .single();


      if (
        error ||
        !employee ||
        employee.role !== "manager"
      ) {

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

        return;
      }


      loadArchivedTasks();

    }



    // تحميل المهام المؤرشفة
    async function loadArchivedTasks() {

      const container =
        document.getElementById(
          "tasksContainer"
        );


      const {
        data: tasks,
        error
      } = await supabaseClient

        .from("tasks")

        .select(`
          id,
          title,
          description,
          status,
          priority,
          due_date,
          created_at,
          archived,

          projects (
            name
          ),

          employees (
            name
          ),

          clients (
            name
          )
        `)

        .eq("archived", true)

        .order(
          "created_at",
          {
            ascending: false
          }
        );


      if (error) {

        console.error(
          "ARCHIVED TASKS ERROR:",
          error
        );

        container.innerHTML =
          `<p>
            تعذر تحميل المهام المؤرشفة:
            ${error.message}
          </p>`;

        return;
      }


      if (
        !tasks ||
        tasks.length === 0
      ) {

        container.innerHTML =
          "<p>لا توجد مهام مؤرشفة حاليًا.</p>";

        return;
      }


      container.innerHTML = "";


      tasks.forEach(task => {

        const card =
          document.createElement(
            "div"
          );


        card.className = "card";


        card.style.marginTop =
          "15px";


        card.innerHTML = `

          <h3>
            ${task.title || "مهمة بدون عنوان"}
          </h3>


          <p>
            <strong>المشروع:</strong>
            ${task.projects?.name || "غير محدد"}
          </p>


          <p>
            <strong>الموظف:</strong>
            ${task.employees?.name || "غير محدد"}
          </p>


          <p>
            <strong>العميل:</strong>
            ${task.clients?.name || "غير محدد"}
          </p>


          <p>
            <strong>الوصف:</strong>
            ${task.description || "لا يوجد وصف"}
          </p>


          <p>
            <strong>الحالة:</strong>
            ${task.status || "غير محددة"}
          </p>


          <p>
            <strong>الأولوية:</strong>
            ${task.priority || "غير محددة"}
          </p>


          <p>
            <strong>موعد التسليم:</strong>
            ${task.due_date || "غير محدد"}
          </p>


          <button
            class="restore-task"
            data-task-id="${task.id}"
            type="button"
          >
            استعادة المهمة
          </button>

        `;


        container.appendChild(
          card
        );

      });

    }



    // استعادة المهمة
    document.addEventListener(
      "click",
      async (event) => {

        const button =
          event.target.closest(
            ".restore-task"
          );


        if (!button) {
          return;
        }


        const taskId =
          button.getAttribute(
            "data-task-id"
          );


        if (!taskId) {

          alert(
            "رقم المهمة غير موجود."
          );

          return;
        }


        const confirmed =
          confirm(
            "هل تريد استعادة هذه المهمة؟"
          );


        if (!confirmed) {
          return;
        }


        button.disabled = true;

        button.textContent =
          "جارٍ الاستعادة...";


        const {
          error
        } = await supabaseClient

          .from("tasks")

          .update({
            archived: false
          })

          .eq("id", taskId);


        if (error) {

          console.error(
            "RESTORE ERROR:",
            error
          );


          alert(
            "تعذر استعادة المهمة: " +
            error.message
          );


          button.disabled = false;

          button.textContent =
            "استعادة المهمة";

          return;
        }


        await loadArchivedTasks();

      }
    );



    // تسجيل الخروج
    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        async () => {

          const {
            error
          } =
            await supabaseClient.auth.signOut();


          if (error) {

            alert(
              "تعذر تسجيل الخروج"
            );

            return;
          }


          window.location.href =
            "login.html";

        }
      );


    // تشغيل الصفحة
    checkManagerAccess();

  </script>

</body>

</html>
