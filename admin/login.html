<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول — وِشْ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <main class="main" style="max-width: 450px; margin: 80px auto; width: 100%;">
      <div class="card">
        <h1>تسجيل الدخول</h1>
        <p>لوحة إدارة وِشْ</p>
        <form id="loginForm">
          <label for="email">الإيميل</label>
          <input
            type="email"
            id="email"
            required
            autocomplete="email"
          >
          <label for="password">كلمة المرور</label>
          <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
          >
          <button type="submit">دخول</button>
          <p id="loginMessage"></p>
        </form>
      </div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("loginMessage");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "جارٍ تسجيل الدخول...";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });
      if (error) {
        console.error(error);
        message.textContent = "الإيميل أو كلمة المرور غير صحيحة.";
        return;
      }
      const user = data.user;
      const { data: employee, error: employeeError } = await supabaseClient
        .from("employees")
        .select("id, name, email, role")
        .eq("id", user.id)
        .single();
      if (employeeError || !employee || employee.role !== "manager") {
        await supabaseClient.auth.signOut();
        message.textContent = "هذا الحساب ليس لديه صلاحية مدير.";
        return;
      }
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
